[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "lan-mouse-python"
version = "0.1.0"
description = "Share a mouse, keyboard and clipboard between Linux and Windows"
requires-python = ">=3.11"
dependencies = [
  "PySide6-Essentials>=6.8,<7",
  "cryptography>=44,<51",
  "zeroconf>=0.140,<1",
  "evdev>=1.9,<3; sys_platform == 'linux'",
  "pynput>=1.8,<2; sys_platform == 'win32'",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.12,<1"]

[project.scripts]
lan-mouse = "lanmouse.app:main"

[tool.setuptools.packages.find]
include = ["lanmouse*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
